<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>/trace XR</title>
  <meta name="description" content="Step inside the blockchain. A living portrait of the Ethereum network, woven one block at a time, in immersive WebXR.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --accent: #00ff88;
      --void: #000308;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--void);
      color: #fff;
      font-family: 'Outfit', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #xr-root { position: fixed; inset: 0; }
    #xr-root canvas { display: block; width: 100%; height: 100%; }

    /* --- Boot veil: covers the first few frames while shaders compile ----- */
    #boot-veil {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(circle at 50% 55%, #04121b 0%, #000308 70%);
      transition: opacity 0.9s ease, visibility 0.9s;
    }
    #boot-veil.gone { opacity: 0; visibility: hidden; pointer-events: none; }

    #boot-veil h1 {
      margin: 0;
      font-weight: 200;
      font-size: clamp(38px, 7vw, 76px);
      letter-spacing: -0.02em;
      text-transform: lowercase;
    }
    #boot-veil h1 span { color: var(--accent); }

    #boot-veil p {
      margin: 0;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
    }

    .boot-pulse {
      width: 180px;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      border-radius: 2px;
    }
    .boot-pulse::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      background: var(--accent);
      animation: sweep 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes sweep {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* --- Desktop affordances, hidden the moment a session starts --------- */
    #desktop-hint {
      position: fixed;
      left: 50%;
      bottom: 96px;
      transform: translateX(-50%);
      z-index: 400;
      display: flex;
      gap: 22px;
      padding: 12px 22px;
      border-radius: 999px;
      background: rgba(4, 8, 12, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(12px);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.50);
      transition: opacity 0.4s ease;
      white-space: nowrap;
    }
    #desktop-hint.hidden { opacity: 0; pointer-events: none; }
    #desktop-hint kbd {
      font-family: inherit;
      color: var(--accent);
      border: 1px solid rgba(0, 255, 136, 0.35);
      border-radius: 3px;
      padding: 1px 5px;
      margin-right: 5px;
    }

    #flat-link {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 400;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      padding: 9px 14px;
      transition: color 0.2s, border-color 0.2s;
    }
    #flat-link:hover { color: var(--accent); border-color: rgba(0, 255, 136, 0.4); }

    #no-webgl {
      position: fixed;
      inset: 0;
      z-index: 600;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      background: var(--void);
      line-height: 1.7;
    }

    @media (max-width: 720px) {
      #desktop-hint { display: none; }
    }
  </style>
</head>
<body>

  <div id="xr-root"></div>

  <div id="boot-veil">
    <h1>/trace<span>.xr</span></h1>
    <div class="boot-pulse"></div>
    <p>Weaving the tapestry</p>
  </div>

  <div id="desktop-hint">
    <span><kbd>drag</kbd>look</span>
    <span><kbd>wasd</kbd>move</span>
    <span><kbd>click</kbd>open a block</span>
    <span><kbd>f</kbd>focus</span>
    <span><kbd>p</kbd>portrait</span>
    <span><kbd>?</kbd>guide</span>
  </div>

  <a id="flat-link" href="mosaic.html">2D version</a>

  <div id="no-webgl">
    <div>
      <h2 style="font-weight:300">This experience needs WebGL 2.</h2>
      <p style="opacity:0.6">Open <a href="mosaic.html" style="color:#00ff88">the 2D version</a> instead, or try a current browser.</p>
    </div>
  </div>

  <script>
    // Fail loudly and usefully rather than showing a black screen.
    (function () {
      var canvas = document.createElement('canvas');
      if (!canvas.getContext('webgl2') && !canvas.getContext('webgl')) {
        document.getElementById('no-webgl').style.display = 'flex';
        document.getElementById('boot-veil').classList.add('gone');
      }
    })();

    window.addEventListener('error', function (e) {
      var veil = document.getElementById('boot-veil');
      if (veil && !veil.classList.contains('gone')) {
        veil.querySelector('p').textContent = 'Failed to start — ' + (e.message || 'see console');
        veil.querySelector('p').style.color = '#ff6b6b';
        veil.querySelector('.boot-pulse').style.display = 'none';
      }
    });
  </script>

  <script type="module" src="xr/main.js"></script>
</body>
</html>
